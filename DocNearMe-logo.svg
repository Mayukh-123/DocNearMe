<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894"/>
      <stop offset="100%" style="stop-color:#00796b"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0984e3"/>
      <stop offset="100%" style="stop-color:#0652a0"/>
    </linearGradient>
  </defs>

  <!-- Map pin shape -->
  <path d="M 44 15 C 30 15 20 25 20 38 C 20 54 44 80 44 80 C 44 80 68 54 68 38 C 68 25 58 15 44 15 Z" fill="url(#pinGrad)" opacity="0.95"/>
  <!-- Pin inner circle -->
  <circle cx="44" cy="38" r="14" fill="white"/>
  <!-- Medical cross inside pin -->
  <rect x="40" y="30" width="8" height="16" rx="2" fill="url(#crossGrad)"/>
  <rect x="36" y="34" width="16" height="8" rx="2" fill="url(#crossGrad)"/>

  <!-- Pulse line coming out of pin -->
  <polyline points="72,50 80,50 85,35 90,62 95,42 100,50 108,50" stroke="#00b894" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text -->
  <text x="116" y="48" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#0652a0" letter-spacing="0.3">Doc<tspan fill="#00b894">NearMe</tspan></text>
  <text x="117" y="64" font-family="Arial, sans-serif" font-size="9" fill="#636e72" letter-spacing="1.8">FIND. BOOK. HEAL.</text>
  <line x1="116" y1="68" x2="278" y2="68" stroke="#00b894" stroke-width="1.5" opacity="0.4"/>
</svg>
